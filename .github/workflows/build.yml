name: Build JARVIS AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH=""

          if [ -f "$GITHUB_WORKSPACE/JARVIS-AI-Android.zip" ]; then
            ZIP_PATH="$GITHUB_WORKSPACE/JARVIS-AI-Android.zip"
          else
            ZIP_PATH="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname 'JARVIS-AI-Android.zip' \
              -print -quit)"
          fi

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::JARVIS-AI-Android.zip não foi encontrado."
            echo "Coloque o ZIP na raiz do repositório."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_PATH"

          EXTRACT_DIR="$RUNNER_TEMP/jarvis-extracted"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_PATH" -d "$EXTRACT_DIR"

          PROJECT_DIR="$(find "$EXTRACT_DIR" \
            -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Arquivo settings.gradle(.kts) não encontrado."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts não encontrado no projeto."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Build debug APK with detailed logs
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          LOG_FILE="$RUNNER_TEMP/jarvis-build.log"

          gradle --no-daemon --stacktrace --info \
            :app:assembleDebug 2>&1 | tee "$LOG_FILE"

          BUILD_STATUS=${PIPESTATUS[0]}

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "========== ERROS DE COMPILAÇÃO =========="

            grep -n -i -E -B 5 -A 8 \
              '(^e: |error:|exception|symbol processing|ksp.*error|cannot find|unresolved reference|compilation error)' \
              "$LOG_FILE" | tail -n 200 || true

            echo "========== FIM DOS ERROS =========="
          fi

          exit "$BUILD_STATUS"

      - name: Run unit tests
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon :app:testDebugUnitTest

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK não encontrado: $APK_PATH"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/artifacts/JARVIS-AI-debug.apk"

          echo "APK preparado com sucesso."

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-Android-APK
          path: artifacts/JARVIS-AI-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-Build-Logs
          path: ${{ runner.temp }}/jarvis-build.log
          if-no-files-found: ignore
          retention-days: 7
