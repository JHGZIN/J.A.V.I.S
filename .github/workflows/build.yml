name: Build J.A.R.V.I.S. AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: read

jobs:
  build:
    name: Extract and Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Localizar e extrair o ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="$GITHUB_WORKSPACE/JARVIS-AI-Android.zip"

          if [ ! -f "$ZIP_PATH" ]; then
            ZIP_PATH="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname 'JARVIS-AI-Android.zip' \
              -not -path '*/.git/*' \
              -print -quit)"
          fi

          if [ -z "${ZIP_PATH:-}" ] || [ ! -f "$ZIP_PATH" ]; then
            echo "::error::JARVIS-AI-Android.zip não encontrado na raiz do repositório."
            echo "Envie o arquivo ZIP para o GitHub e tente novamente."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_PATH"

          mkdir -p "$RUNNER_TEMP/jarvis-extracted"
          unzip -oq "$ZIP_PATH" -d "$RUNNER_TEMP/jarvis-extracted"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/jarvis-extracted" \
            -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::O ZIP não contém settings.gradle ou settings.gradle.kts."
            find "$RUNNER_TEMP/jarvis-extracted" -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::O projeto não contém o arquivo Gradle do módulo app."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto extraído em: $PROJECT_DIR"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Verificar estrutura do projeto
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Diretório do projeto:"
          pwd

          echo "Arquivos Gradle encontrados:"
          find . -maxdepth 3 \
            \( -name 'build.gradle' -o -name 'build.gradle.kts' \
               -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print

      - name: Compilar APK Debug
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Executar testes unitários
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest

      - name: Localizar e preparar APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          APK_PATH="$(find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit 2>/dev/null || true)"

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::O APK não foi gerado."
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/artifacts/JARVIS-AI-debug.apk"

          echo "APK preparado com sucesso."
          ls -lh "$GITHUB_WORKSPACE/artifacts/JARVIS-AI-debug.apk"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-Android-APK
          path: artifacts/JARVIS-AI-debug.apk
          if-no-files-found: error
          retention-days: 7
